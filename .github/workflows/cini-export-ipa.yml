name: Cini Ustasi signed IPA

on:
  push:
    branches: [codex/cini-ustasi-release-prep]
    paths: ['prototypes/cini-ustasi/app/release/export-istek.txt']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-ipa:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: prototypes/cini-ustasi/app
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototypes/cini-ustasi/app/package-lock.json
      - name: Install and prepare the iOS project
        run: |
          npm ci --ignore-scripts
          npm run sync
      - name: Archive and export an IPA
        run: |
          set -euo pipefail
          : "${APPLE_TEAM_ID:?missing APPLE_TEAM_ID}" "${IOS_DISTRIBUTION_P12:?missing certificate}" "${IOS_P12_PASSWORD:?missing certificate password}" "${IOS_PROFILE_B64:?missing profile}"
          umask 077
          P12_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/cini.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/cini-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -base64 24)"
          printf '%s' "$IOS_DISTRIBUTION_P12" | base64 -D > "$P12_PATH"
          printf '%s' "$IOS_PROFILE_B64" | base64 -D > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" >/dev/null
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          trap 'rm -f "$P12_PATH" "$PROFILE_PATH"; security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true' EXIT
          mkdir -p build/ios
          xcodebuild -quiet -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$PWD/build/ios/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='iPhone Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" PRODUCT_BUNDLE_IDENTIFIER=com.evrenaltindal.ciniustasi CURRENT_PROJECT_VERSION=1 archive
          cat > build/ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>iPhone Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.evrenaltindal.ciniustasi</key><string>${PROFILE_UUID}</string>
            </dict>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$PWD/build/ios/App.xcarchive" \
            -exportOptionsPlist "$PWD/build/ios/ExportOptions.plist" \
            -exportPath "$PWD/build/ios/export"
      - name: Verify the signed IPA
        run: |
          set -euo pipefail
          IPA="$(find build/ios/export -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-check"
          APP="$RUNNER_TEMP/ipa-check/Payload/App.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" = 'com.evrenaltindal.ciniustasi'
          test -f "$APP/embedded.mobileprovision"
          test -f "$APP/public/privacy.html"
          codesign --verify --deep --strict --verbose=2 "$APP"
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/embedded-profile.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/embedded-profile.plist")" = "$APPLE_TEAM_ID.com.evrenaltindal.ciniustasi"
      - name: Keep the signed IPA for download
        uses: actions/upload-artifact@v4
        with:
          name: cini-ustasi-ipa
          path: prototypes/cini-ustasi/app/build/ios/export/*.ipa
          if-no-files-found: error
          retention-days: 7

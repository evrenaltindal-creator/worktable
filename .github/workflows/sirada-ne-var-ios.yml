name: Sirada Ne Var iOS

# Sırada Ne Var? App Store / TestFlight işleri: durum, paket kimliği kaydı,
# derleme ve yükleme, TestFlight test grubu, mağaza sayfası (7 dil).
# Tetikleme: sirada-ne-var/store/istek.txt dosyasının ilk satırına iş adı
# (status, register, build, testers, metadata) yazılıp bu dala gönderilir.
# Varsayılan dala alınınca Actions sekmesinden elle de başlatılabilir.
# Yalnızca derleme Mac sunucusunda (Xcode 26) çalışır; diğer işler Linux'ta.
# Secret'lar depodaki diğer iOS uygulamalarıyla ortaktır.
on:
  push:
    branches: [claude/sleepy-franklin-vc73f0]
    paths: ['sirada-ne-var/store/istek.txt']
  workflow_dispatch:
    inputs:
      lane:
        description: 'Yapılacak iş'
        type: choice
        options: [status, register, build, testers, metadata]
        default: status

concurrency:
  group: sirada-ne-var-ios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
      ok: ${{ steps.ready.outputs.ok }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      INPUT_LANE: ${{ inputs.lane }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: sirada-ne-var/store

      - name: Isi sec
        id: lane
        run: |
          LANE="$INPUT_LANE"
          if [ -z "$LANE" ]; then LANE=$(head -n1 sirada-ne-var/store/istek.txt | tr -d '[:space:]'); fi
          case "$LANE" in status|register|build|testers|metadata) ;; *) echo "::error::Bilinmeyen is: '$LANE'"; exit 1;; esac
          echo "lane=$LANE" >> "$GITHUB_OUTPUT"
          echo "Is: $LANE"

      - name: Secret'lar hazir mi
        id: ready
        env:
          LANE: ${{ steps.lane.outputs.lane }}
        run: |
          missing=""
          need="ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8"
          if [ "$LANE" = build ]; then need="$need APPLE_TEAM_ID IOS_DISTRIBUTION_P12 IOS_P12_PASSWORD"; fi
          for k in $need; do [ -n "${!k}" ] || missing="$missing $k"; done
          if [ -n "$missing" ]; then
            echo "::error::GitHub secret'lari eksik:$missing (sirada-ne-var/YAYINLAMA.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

  app-store:
    needs: plan
    if: needs.plan.outputs.ok == 'true'
    runs-on: ${{ needs.plan.outputs.lane == 'build' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sirada-ne-var
    env:
      LANE: ${{ needs.plan.outputs.lane }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Uygulamayi Xcode projesine kopyala
        if: env.LANE == 'build'
        run: |
          npm ci
          npx cap sync ios
          xcodebuild -version

      - name: fastlane
        run: |
          command -v fastlane >/dev/null || sudo gem install fastlane --no-document
          fastlane ios "$LANE"

      - name: Hata olursa derleme ayarlarini sakla
        if: failure() && env.LANE == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: sirada-ne-var-build-debug
          path: sirada-ne-var/build/ios/*.plist
          if-no-files-found: ignore

# Ok Kaçış iOS uygulamasını GitHub'ın bulut Mac'inde derler ve App Store Connect'e yükler.
# Mac gerekmez. Çalıştırmak için: GitHub > Actions > "iOS: App Store Connect'e yükle" > Run workflow
# Önce eklenmesi gereken 4 gizli anahtar ve adımlar: ok-kacis/store/APP-STORE-REHBERI.md
name: "iOS: App Store Connect'e yükle"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App Store'da görünecek sürüm (ör. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

concurrency:
  group: ios-app-store
  cancel-in-progress: false

jobs:
  ios:
    name: Derle ve yükle
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ok-kacis
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Gizli anahtarlar eklenmiş mi?
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Eksik gizli anahtar(lar):$missing. Settings > Secrets and variables > Actions altına ekle (ok-kacis/store/APP-STORE-REHBERI.md)."
            exit 1
          fi
          if ! printf '%s' "$APP_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,2}$'; then
            echo "::error::Sürüm 1.0.0 biçiminde olmalı, girilen: $APP_VERSION"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ok-kacis/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Testler
        run: npm test

      - name: Oyunu iOS projesine kopyala
        run: npx cap sync ios

      - name: App Store Connect API anahtarını hazırla
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Xcode sürümü
        run: xcodebuild -version

      - name: Arşivle (Release)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*sign|ARCHIVE (SUCCEEDED|FAILED)|Signing Identity" || true
          test -d "$RUNNER_TEMP/App.xcarchive" || { echo "::error::Arşiv oluşmadı, ayrıntı için 'xcodebuild-log' ekine bak."; exit 1; }

      - name: App Store Connect'e yükle
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          echo "### Yüklendi: Ok Kaçış $APP_VERSION (yapı $BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
          echo "App Store Connect > Uygulamam > TestFlight'ta 15-30 dakika içinde görünür." >> "$GITHUB_STEP_SUMMARY"

      - name: Hata olursa günlükleri sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore

      - name: Anahtarı sil
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

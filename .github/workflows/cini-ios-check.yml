name: Cini Ustasi iOS build check

on:
  push:
    branches: [codex/cini-ustasi-release-prep]
    paths:
      - 'prototypes/cini-ustasi/**'
      - '.github/workflows/cini-ios-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: prototypes/cini-ustasi/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototypes/cini-ustasi/app/package-lock.json
      - name: Install dependencies and sync iOS project
        run: |
          npm ci --ignore-scripts
          npm run sync
      - name: Build for iOS Simulator without signing
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build for iPhone without signing
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
